<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean baseline page</title>
<style>
  :root { --ink: #1f2937; --brand: #1d4ed8; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: #fff; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid #e5e7eb; }
  header nav { display: flex; gap: 16px; }
  header a { color: var(--brand); text-decoration: none; padding: 8px 12px; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 24px; }
  h1 { font-size: 32px; margin: 0 0 8px; }
  p { margin: 0 0 16px; }
  .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .btn { display: inline-block; background: var(--brand); color: #fff; padding: 10px 20px; border-radius: 6px; border: 0; font-size: 16px; cursor: pointer; }
  img { max-width: 100%; height: auto; display: block; }
  footer { padding: 24px; text-align: center; color: #4b5563; font-size: 14px; }
</style>
</head>
<body>
<header>
  <strong>Acme</strong>
  <nav><a href="#a">Products</a><a href="#b">Pricing</a><a href="#c">Docs</a></nav>
</header>
<main>
  <h1>Welcome back</h1>
  <p>Everything on this page is laid out correctly, so the layout checks should stay quiet.</p>
  <div class="card">
    <h2>Getting started</h2>
    <p>Create a project, invite your team, and ship your first release in minutes.</p>
    <button class="btn">Create project</button>
  </div>
  <img alt="Placeholder banner" width="400" height="100"
       src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='100'%3E%3Crect width='400' height='100' fill='%23dbeafe'/%3E%3C/svg%3E">
</main>
<footer>© 2026 Acme Inc.</footer>
</body>
</html>
